name: Contract Tests
on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday 9 AM UTC
  workflow_dispatch: {}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/contract/
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Spotify API contract test failed',
              body: 'The weekly contract test detected a change in the Spotify API. Check the workflow run for details.',
              labels: ['bug', 'api-contract']
            });
